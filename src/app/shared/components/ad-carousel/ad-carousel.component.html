<div class="ad-carousel-wrapper" (mouseenter)="stopAutoPlay()" (mouseleave)="startAutoPlay()">
  <div class="carousel-track" [style.transform]="'translateX(-' + (currentIndex * 100) + '%)'">
    <div class="carousel-slide" *ngFor="let slide of slides; let i = index">
      <div class="slide-card" [style.backgroundImage]="'linear-gradient(to right, rgba(15, 23, 42, 0.92) 0%, rgba(15, 23, 42, 0.6) 60%, rgba(15, 23, 42, 0.2) 100%), url(' + slide.imageUrl + ')'">
        <div class="slide-content">
          <div *ngIf="slide.badge" class="slide-badge">
            <span class="badge-dot"></span>
            {{ slide.badge }}
          </div>
          <h2 class="slide-title">{{ slide.title }}</h2>
          <p class="slide-subtitle">{{ slide.subtitle }}</p>
          <div class="slide-footer">
            <a [routerLink]="slide.linkUrl" class="cta-button" (click)="onAdClick(slide)">
              <span>{{ slide.buttonText }}</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </a>
            <span *ngIf="slide.highlightPrice" class="highlight-tag">{{ slide.highlightPrice }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Navigation Arrows -->
  <button class="nav-arrow prev" (click)="prevSlide()" aria-label="Previous Slide">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M15 19l-7-7 7-7"/>
    </svg>
  </button>
  <button class="nav-arrow next" (click)="nextSlide()" aria-label="Next Slide">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M9 5l7 7-7 7"/>
    </svg>
  </button>

  <!-- Dots Indicator -->
  <div class="carousel-dots">
    <button
      *ngFor="let slide of slides; let i = index"
      class="dot"
      [class.active]="i === currentIndex"
      (click)="goToSlide(i)"
      [attr.aria-label]="'Go to slide ' + (i + 1)">
    </button>
  </div>
</div>
